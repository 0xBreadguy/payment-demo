[profile.default]
src = "contract/src"
out = "contract/out"
libs = ["contract/lib"]
cache_path = "contract/cache"
optimizer = true
optimizer_runs = 200
hardfork = "tempo:T2"
extra_output = ["storageLayout"]
invariant = { fail_on_revert = true, show_solidity = true }
fs_permissions = [{ access = "read-write", path = "./contract" }]
via_ir = true
remappings = [
    "tempo-std/=contract/lib/tempo-std/src/",
    "forge-std/=contract/lib/forge-std/src/",
    "solady/=contract/lib/solady/src/"
]

[profile.ci]
optimizer = true
optimizer_runs = 1
invariant = { runs = 10, depth = 50, fail_on_revert = true, show_solidity = true }

[profile.fuzz500]
optimizer = true
optimizer_runs = 200
via_ir = true
invariant = { runs = 500, depth = 500, fail_on_revert = true, show_solidity = true }

[fmt]
line_length = 100
sort_imports = true
contract_new_lines = true
bracket_spacing = true
number_underscore = "thousands"
multiline_func_header = "all"
